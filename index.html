<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>フィード</title>
<style>
  :root {
    --name: #e8eaed;     /* 名前の色(吹き出しの外=背景の上) */
    --sub: #8b9098;      /* 日付の色(吹き出しの外=背景の上) */
    --bubble: #ffffff;   /* 吹き出しの背景 */
    --bubble-text: #1c1e21;
    --icon-bg: #e9edf2;
    --icon-fg: #5b6573;
  }
  /* 単体で開いた時(iframeに埋め込まれていない時)だけ、白い吹き出しが見えるようダーク背景にする */
  html.standalone {
    --name: #e8eaed;
    --sub: #9aa0a8;
    --page: #17191c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; }
  html.standalone, html.standalone body { background: var(--page); }
  body {
    color: var(--bubble-text);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    font-size: 15px;
    line-height: 1.7;
    -webkit-text-size-adjust: 100%;
  }
  #feed { max-width: 600px; margin: 0 auto; padding: 8px 0; }
  .post {
    display: flex;
    gap: 12px;
    padding: 10px 16px;
  }
  .avatar {
    flex: none;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--icon-bg);
    color: var(--icon-fg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 17px;
    overflow: hidden;
  }
  .avatar.has-img { background: transparent; border-radius: 0; overflow: visible; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .avatar.has-img img { object-fit: contain; }
  .body { min-width: 0; flex: 1; }
  .head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; line-height: 1.4; margin-bottom: 6px; }
  .name { font-weight: 700; color: var(--name); }
  .date { color: var(--sub); font-size: 13px; }

  /* 白い吹き出し */
  .bubble {
    position: relative;
    display: inline-block;
    max-width: 100%;
    padding: 10px 14px;
    background: var(--bubble);
    color: var(--bubble-text);
    border-radius: 0 16px 16px 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.18);
  }
  /* 左上のしっぽ(アイコン側) */
  .bubble::before {
    content: "";
    position: absolute;
    top: 0;
    left: -7px;
    border-style: solid;
    border-width: 0 8px 10px 0;
    border-color: transparent var(--bubble) transparent transparent;
  }
  .text {
    margin: 0;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .text a { color: inherit; text-decoration: underline; text-decoration-color: var(--sub); text-underline-offset: 2px; }
  .image {
    display: block;
    max-width: 100%;
    margin-top: 8px;
    border-radius: 12px;
  }
  .msg { padding: 32px 16px; color: var(--sub); text-align: center; }
</style>
</head>
<body>
<main id="feed" aria-live="polite"></main>

<script>
(function () {
  // 単体で開かれている場合のみダーク背景(埋め込み時は透過のまま)
  try {
    if (window.top === window.self) document.documentElement.classList.add('standalone');
  } catch (e) {}

  var feed = document.getElementById('feed');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function linkify(s) {
    return esc(s).replace(/(https?:\/\/[^\s<]+)/g, function (u) {
      return '<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + u + '</a>';
    });
  }

  function parseDate(s) {
    return new Date(String(s).replace(' ', 'T'));
  }

  function fmtDate(s) {
    var d = parseDate(s);
    if (isNaN(d)) return esc(s);
    var p = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '/' + p(d.getMonth() + 1) + '/' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function avatar(profile) {
    if (profile.icon) {
      return '<div class="avatar has-img"><img src="' + esc(profile.icon) + '" alt=""></div>';
    }
    return '<div class="avatar">' + esc((profile.name || '?').charAt(0)) + '</div>';
  }

  function render(data) {
    var profile = data.profile || {};
    var posts = (data.posts || []).slice().sort(function (a, b) {
      return parseDate(b.date) - parseDate(a.date);
    });
    if (!posts.length) {
      feed.innerHTML = '<p class="msg">投稿はまだありません。posts.txt に追加してください。</p>';
      return;
    }
    feed.innerHTML = posts.map(function (p) {
      return '<article class="post">' +
        avatar(profile) +
        '<div class="body">' +
          '<div class="head"><span class="name">' + esc(profile.name || '') + '</span>' +
          '<time class="date">' + fmtDate(p.date) + '</time></div>' +
          '<div class="bubble">' +
            '<p class="text">' + linkify(p.text || '') + '</p>' +
            (p.image ? '<img class="image" src="' + esc(p.image) + '" alt="" loading="lazy">' : '') +
          '</div>' +
        '</div>' +
      '</article>';
    }).join('');
  }

  // posts.txt の書式:
  //   name: 名前
  //   icon: icon.svg
  //   ===
  //   2026-10-17 12:00
  //   本文(改行そのまま)
  //   image: img/xxx.jpg   ← 任意
  //   ---
  //   次の投稿...
  //   (title: / color: の行が残っていても無視されます)
  function parse(src) {
    src = src.replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n');
    var idx = src.search(/^===\s*$/m);
    var head = idx >= 0 ? src.slice(0, idx) : '';
    var rest = idx >= 0 ? src.slice(src.indexOf('\n', idx) + 1) : src;

    var profile = {};
    head.split('\n').forEach(function (line) {
      var m = line.match(/^(name|icon)\s*[:：]\s*(.*)$/);
      if (m) profile[m[1]] = m[2].trim();
    });

    var posts = rest.split(/^---\s*$/m).map(function (block) {
      var lines = block.replace(/^\n+|\s+$/g, '').split('\n');
      if (!lines[0]) return null;
      var date = lines.shift().trim();
      var image = '';
      var text = lines.filter(function (l) {
        var m = l.match(/^image\s*[:：]\s*(.+)$/);
        if (m) { image = m[1].trim(); return false; }
        return true;
      }).join('\n').trim();
      return { date: date, text: text, image: image };
    }).filter(Boolean);

    return { profile: profile, posts: posts };
  }

  fetch('posts.txt', { cache: 'no-cache' })
    .then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.text();
    })
    .then(function (t) { render(parse(t)); })
    .catch(function () {
      feed.innerHTML = '<p class="msg">posts.txt を読み込めませんでした。ファイル名と置き場所を確認してください。</p>';
    });
})();
</script>
</body>
</html>
